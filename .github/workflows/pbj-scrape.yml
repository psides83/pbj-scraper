name: PBJ Scrape And Publish

on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * 6"

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TZ: America/Chicago
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers
      DATA_FILE: docs/pbj-detailed.json
      TOTAL_CARDS: "180"
      CHUNK_SIZE: "40"
      CHUNK_RETRIES: "1"
      REFRESH_EVERY: "10"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Debug Runtime
        shell: bash
        run: |
          node -v
          npm -v
          pwd
          ls -la

      - name: Install Dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Playwright Browser Path
        shell: bash
        run: |
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH"
          ls -la "$PLAYWRIGHT_BROWSERS_PATH" || true

      - name: Run Scrape + Merge
        run: npm run update:data

      - name: Verify Output Exists
        shell: bash
        run: |
          if [[ ! -f docs/pbj-detailed.json ]]; then
            echo "Missing docs/pbj-detailed.json"
            exit 1
          fi

      - name: Commit Updated JSON
        shell: bash
        run: |
          if git diff --quiet -- docs/pbj-detailed.json; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/pbj-detailed.json
          git commit -m "chore: update PBJ data"
          git push
